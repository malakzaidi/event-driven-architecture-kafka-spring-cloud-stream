<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>📊 Real-Time Analytics Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/smoothie/1.34.0/smoothie.min.js"></script>
    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: radial-gradient(circle at top, #0f2027, #203a43, #2c5364);
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        h1 {
            font-size: 2em;
            letter-spacing: 1px;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(0,255,255,0.7);
        }

        .dashboard {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
            padding: 30px 40px;
            text-align: center;
            width: 80%;
            max-width: 800px;
            backdrop-filter: blur(8px);
        }

        #chart2 {
            width: 100%;
            height: 400px;
            border-radius: 15px;
            background: rgba(0, 0, 0, 0.4);
        }

        .legend {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 15px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .color-box {
            width: 16px;
            height: 16px;
            border-radius: 4px;
        }

        footer {
            margin-top: 20px;
            font-size: 0.85em;
            opacity: 0.7;
        }
    </style>
</head>
<body>

<div class="dashboard">
    <h1>📈 Real-Time Page Analytics</h1>
    <canvas id="chart2" width="700" height="400"></canvas>

    <div class="legend" id="legend"></div>

    <footer>Live data powered by <strong>EventSource</strong> ⚡</footer>
</div>

<script>
    // Initialize chart
    var index = -1;
    var colors = [
        { name: "Page P1", stroke: 'rgba(0, 255, 128, 1)', fill: 'rgba(0, 255, 128, 0.3)' },
        { name: "Page P2", stroke: 'rgba(255, 99, 132, 1)', fill: 'rgba(255, 99, 132, 0.3)' }
    ];

    function randomColor() {
        ++index;
        if (index >= colors.length) index = 0;
        return colors[index];
    }

    var pages = ["P1", "P2"];
    var courbe = [];
    var smoothieChart = new SmoothieChart({
        tooltip: true,
        millisPerPixel: 50,
        grid: { strokeStyle: 'rgba(255,255,255,0.1)', lineWidth: 1, millisPerLine: 1000, verticalSections: 5 },
        labels: { fillStyle: '#fff' }
    });

    smoothieChart.streamTo(document.getElementById("chart2"), 500);

    // Add lines dynamically
    pages.forEach(function(v) {
        courbe[v] = new TimeSeries();
        var col = randomColor();
        smoothieChart.addTimeSeries(courbe[v], {
            strokeStyle: col.stroke,
            fillStyle: col.fill,
            lineWidth: 3
        });

        // Add legend entry
        const legend = document.getElementById("legend");
        const item = document.createElement("div");
        item.classList.add("legend-item");
        item.innerHTML = `<div class="color-box" style="background:${col.stroke}"></div><span>${col.name}</span>`;
        legend.appendChild(item);
    });

    // Real-time data source
    var stockEventSource = new EventSource("/analytics");
    stockEventSource.addEventListener("message", function(event) {
        var data = JSON.parse(event.data);
        pages.forEach(function(v) {
            var val = data[v];
            courbe[v].append(new Date().getTime(), val);
        });
    });
</script>
</body>
</html>
